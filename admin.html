<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hackathon 2026 | Registration Dashboard</title><style>:root{--bg:#070b18;--text:#f5f7ff;--muted:#aab3cc;--accent:#7c5cff;--accent2:#20d9ff;--border:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 0%,rgba(124,92,255,.2),transparent 30%),radial-gradient(circle at 90% 10%,rgba(32,217,255,.12),transparent 25%),var(--bg);color:var(--text)}.wrap{max-width:1200px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.top h1{margin:0;font-size:clamp(28px,5vw,48px)}.top p{color:var(--muted);margin:8px 0 0}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent),#5f8cff);color:#fff}.panel{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:18px;padding:22px}.login{max-width:430px;margin:70px auto}.login h2{margin-top:0}.input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:#0a1021;color:#fff;margin:10px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:16px;padding:20px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:30px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{flex:1}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--accent2);font-size:13px;background:rgba(0,0,0,.2)}td{color:#e9ecf7;font-size:14px}.muted{color:var(--muted)}.error{color:#ff8d8d;margin-top:10px}.hidden{display:none!important}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="panel login"><h2>🔐 Admin Dashboard</h2><p class="muted">View hackathon team registrations.</p><input id="password" class="input" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Open Dashboard</button><div id="loginError" class="error"></div></div><div id="dashboard" class="hidden"><div class="top"><div><h1>Registration Dashboard</h1><p>Inter-Collegiate Hackathon 2026 • C.B. Bhandari Jain College</p></div><button class="btn" onclick="loadData()">↻ Refresh</button></div><div class="stats"><div class="stat"><span>Total registrations</span><strong id="total">0</strong></div><div class="stat"><span>Colleges</span><strong id="colleges">0</strong></div><div class="stat"><span>Tracks</span><strong id="tracks">0</strong></div></div><div class="panel"><div class="toolbar"><input id="search" class="input" placeholder="Search team, college, leader or email" oninput="render()"><button class="btn" onclick="downloadCSV()">Export CSV</button></div><div id="status" class="muted">Loading registrations…</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th>College</th><th>Leader</th><th>Email</th><th>Phone</th><th>Track</th><th>Members</th><th>Registered</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>const API_URL='PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';let adminPassword='',data=[];function login(){adminPassword=document.getElementById('password').value.trim();if(!adminPassword){document.getElementById('loginError').textContent='Enter the admin password.';return}document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadData()}function loadData(){if(API_URL.includes('PASTE_YOUR')){document.getElementById('status').textContent='Connect the Google Apps Script URL in admin.html first.';return}document.getElementById('status').textContent='Loading…';window.receiveRegistrations=function(j){if(!j.ok){document.getElementById('status').textContent='Error: '+j.error;return}data=j.rows||[];document.getElementById('total').textContent=data.length;document.getElementById('colleges').textContent=new Set(data.map(x=>x.college).filter(Boolean)).size;document.getElementById('tracks').textContent=new Set(data.map(x=>x.track).filter(Boolean)).size;render();document.getElementById('status').textContent=data.length?'Registrations loaded.':'No registrations yet.'};const old=document.getElementById('jsonp');if(old)old.remove();const s=document.createElement('script');s.id='jsonp';s.src=API_URL+'?action=list&password='+encodeURIComponent(adminPassword)+'&callback=receiveRegistrations';document.body.appendChild(s)}function render(){const q=document.getElementById('search').value.toLowerCase();const filtered=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));document.getElementById('rows').innerHTML=filtered.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.teamName)}</td><td>${esc(x.college)}</td><td>${esc(x.leader)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.track)}</td><td>${esc(x.members)}</td><td>${esc(x.timestamp)}</td></tr>`).join('')}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]))}function downloadCSV(){const cols=['timestamp','teamName','college','leader','email','phone','track','members'];const lines=[cols.join(','),...data.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='hackathon-registrations.csv';a.click()}</script></body></html>
